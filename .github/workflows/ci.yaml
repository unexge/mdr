name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check .
      - run: zig build test --summary all
      - run: zig build

  bombadil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - run: zig build -Doptimize=ReleaseSafe --summary all
      - name: Bombadil
        uses: antithesishq/bombadil-action@v2
        with:
          version: 0.7.4
          driver: terminal
          command: ./zig-out/bin/mdr ./bombadil/fixture.md
          specification: ./bombadil/mdr.ts
          time-limit: 5m
          exit-on-violation: true
          columns: 120
          rows: 24
          output-path: zig-out/bombadil
          output-path-overwrite: true
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bombadil-trace
          path: zig-out/bombadil

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - name: Fuzz
        run: |
          timeout 300 zig build test --fuzz || code=$?
          # The fuzzer never exits on its own; 124 means the time budget
          # elapsed without a crash.
          if [ "${code:-0}" -eq 124 ]; then exit 0; fi
          exit "${code:-0}"
