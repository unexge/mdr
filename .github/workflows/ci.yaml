name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - run: zig fmt --check .
      - run: zig build test --summary all
      - run: zig build

  bombadil:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - name: Install Bombadil
        run: |
          curl -fsSL -o "$RUNNER_TEMP/bombadil" https://github.com/antithesishq/bombadil/releases/download/v0.7.2/bombadil-x86_64-linux
          chmod +x "$RUNNER_TEMP/bombadil"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Bombadil
        run: |
          log="$RUNNER_TEMP/bombadil.log"
          code=0
          zig build bombadil -Doptimize=ReleaseSafe --summary all >"$log" 2>&1 || code=$?
          tail -n 20 "$log"
          exit "$code"
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: bombadil-trace
          path: zig-out/bombadil

  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: mlugg/setup-zig@v2
      - name: Fuzz
        run: |
          timeout 300 zig build test --fuzz || code=$?
          # The fuzzer never exits on its own; 124 means the time budget
          # elapsed without a crash.
          if [ "${code:-0}" -eq 124 ]; then exit 0; fi
          exit "${code:-0}"
